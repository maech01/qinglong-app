name: Build APK

# 推送后自动构建，并把 APK 同时挂到 Release（免登录直接下载）和 Actions 构件里。
#
# 下载地址（构建完成后）：
#   https://github.com/maech01/qinglong-app/releases/download/latest/app-release.apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 本工程是 2022 年的 Flutter 布局（依赖 apply from: flutter.gradle），
      # Flutter 3.16 起该脚本被移除，所以钉在 3.7.x。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.7.12
          channel: stable
          cache: true

      # 工程自带 Gradle 6.7，跑不了 JDK 17。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: 打印工具链版本
        run: |
          flutter --version
          java -version

      - name: 接受 Android 许可
        run: yes | flutter doctor --android-licenses || true

      - name: 安装所需 Android 平台与 build-tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platform-tools" "platforms;android-33" \
                  "build-tools;33.0.1" "build-tools;30.0.3" || true
          fi

      - name: 生成签名密钥
        run: |
          if [ ! -f android/app/qinglong.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/qinglong.keystore \
              -alias jiangyuesong \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass jiangyuesong -keypass jiangyuesong \
              -dname "CN=qinglong, OU=app, O=qinglong, L=cn, ST=cn, C=cn"
          fi

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查（不阻断构建）
        run: flutter analyze || true

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传为 Actions 构件
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 发布到 Release（免登录下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          body: |
            由 GitHub Actions 自动构建。

            直接下载：`app-release.apk`
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
